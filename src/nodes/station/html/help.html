<script type="text/html" data-help-name="yandex-commander-station">
  <p>Нода управления Яндекс.Станцией — настройка подключения, расписания и сетевых параметров.</p>
  <h3>Настройки</h3>
  <dl class="message-properties">
    <dt>Login <span class="property-type">config</span></dt>
    <dd>Конфигурационная нода подключения (yandex-commander-connect).</dd>
    <dt>Station <span class="property-type">select</span></dt>
    <dd>Выбор станции из списка обнаруженных устройств.</dd>
    <dt>Connection <span class="property-type">toggle</span></dt>
    <dd>Включить/выключить подключение к устройству.</dd>
    <dt>Network <span class="property-type">auto/manual</span></dt>
    <dd>Режим определения сетевого адреса: автоматический (mDNS) или ручной (IP:Port).</dd>
    <dt>Kid Control <span class="property-type">schedule</span></dt>
    <dd>Расписание разрешённого времени воспроизведения по дням недели.</dd>
  </dl>
</script>
