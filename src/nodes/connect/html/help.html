<script type="text/html" data-help-name="yandex-commander-connect">
  <p>Конфигурация подключения к Яндекс.Станциям через OAuth токен.</p>
  <h3>Настройки</h3>
  <dl class="message-properties">
    <dt>oAuthToken <span class="property-type">string</span></dt>
    <dd>OAuth токен для доступа к API Яндекс.</dd>
    <dt>Debug <span class="property-type">boolean</span></dt>
    <dd>Включить отладочные сообщения в логах Node-RED.</dd>
  </dl>
  <h3>Описание</h3>
  <p>Данная нода является конфигурационной и управляет подключением к устройствам Яндекс через WebSocket.
  Автоматически обнаруживает устройства в локальной сети через mDNS и устанавливает защищённое соединение.</p>
</script>
