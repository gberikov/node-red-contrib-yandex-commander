<script type="text/html" data-help-name="yandex-commander-out">
  <p>Нода отправки команд на Яндекс.Станцию.</p>
  <h3>Входы</h3>
  <dl class="message-properties">
    <dt>payload <span class="property-type">string | object</span></dt>
    <dd>Команда или текст для отправки на станцию.</dd>
  </dl>
  <h3>Типы команд</h3>
  <ul>
    <li><b>Player</b> — управление плеером (play, stop, next, prev, forward, backward, volume)</li>
    <li><b>Voice</b> — голосовая команда (как если бы вы сказали Алисе)</li>
    <li><b>TTS</b> — синтез речи с настройками голоса, эффектов и громкости</li>
    <li><b>HomeKit</b> — управление через протокол HomeKit</li>
    <li><b>Stop Listening</b> — прекратить прослушивание</li>
    <li><b>Raw</b> — отправка сырой команды WebSocket</li>
  </ul>
</script>
